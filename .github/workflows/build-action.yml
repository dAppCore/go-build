name: Build action (main)

# Deliberately pinned to dAppCore/build@main rather than a release tag.
#
# This repository is the first consumer of that action, and the coupling is the
# point: if main breaks over there, this build goes red here, and fixing it
# becomes a prerequisite for our own work rather than something discovered by
# whoever ships next. A tag would insulate us from exactly the signal we want.
#
# It does not replace ci.yml. That is the gate on this repository's own code,
# and it must keep passing on its own terms whatever the action is doing.
# This job answers a different question: does the action still work on a real
# project, today.
#
# One caveat worth knowing: the action's wrappers reach for each other as
# `@v4`, so `@main` gives main's entry points with the newest release's
# sub-actions. Releases there are cut per change, so the gap is usually
# minutes; when it matters, the run log names the version each sub-action came
# from.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # A daily run so a break in the action surfaces without needing a commit here.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    name: dAppCore/build@main on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build with dAppCore/build@main
        id: build
        uses: dAppCore/build@main
        with:
          build-name: go-build
          # The module is at go/, and go/cmd/* are library packages with no
          # func main() — so discovery reaches `core`, the library pipeline.
          # Left to detection on purpose: if that answer ever changes, this
          # assertion is how we find out.
          go-directory: go
          package: false

      - name: Assert the stack it chose
        shell: bash
        env:
          STACK: ${{ steps.build.outputs.SELECTED_STACK }}
        run: |
          set -euo pipefail
          echo "[DEBUG_LOG] stack=$STACK"
          if [ "$STACK" != "core" ]; then
            echo "::error::expected the core stack for a library, got '$STACK'"
            exit 1
          fi
