name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  # One run per branch. A push supersedes the one before it, and the older run
  # is answering a question about code nobody has any more — so it is cancelled
  # rather than left to finish and report on a tree that no longer exists.
  #
  # Tags are exempt. A release build is not superseded by anything, and half a
  # release is worse than a slow one.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOFLAGS: -buildvcs=false
  # There is no go.work any more; dependencies resolve from go/go.mod
  # tags. Kept explicit so a workspace reappearing locally cannot change
  # what CI builds.
  GOWORK: "off"
  GOPROXY: "direct"
  GOSUMDB: "off"

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Test with coverage
        working-directory: go
        run: go test -race -coverprofile=coverage.out -covermode=atomic -count=1 ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: go/coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go
          args: --timeout=5m --tests=false

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Test for coverage
        working-directory: go
        run: go test -coverprofile=coverage.out -covermode=atomic -count=1 ./...
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=dappcore
            -Dsonar.projectKey=dappcore_go-build
            -Dsonar.sources=go
            -Dsonar.exclusions=**/vendor/**,**/third_party/**,**/.tmp/**,**/*_test.go
            -Dsonar.tests=go
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.go.coverage.reportPaths=go/coverage.out
